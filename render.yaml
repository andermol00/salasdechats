services:
  - type: web
    name: vela-chat
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx drizzle-kit push --force && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vela-db
          property: connectionString

databases:
  - name: vela-db
    plan: free
