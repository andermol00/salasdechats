services:
  - type: web
    name: notrade
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: notrace-db
          property: connectionString
      - key: GIPHY_API_KEY
        sync: false

databases:
  - name: notrace-db
    plan: free
    region: oregon
